<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3V-1 — Inventory</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/inventory.css" />
</head>
<body>

  <!-- ── SIDEBAR ─────────────────────────────────── -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <h2>🏪 3V-1</h2>
      <p id="currentDate"></p>
    </div>

    <a href="dashboard.html" class="nav-item">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <a href="employees.html" class="nav-item">
      <span class="nav-icon">👥</span> Employees
    </a>
    <a href="inventory.html" class="nav-item active">
      <span class="nav-icon">📦</span> Inventory
    </a>
    <a href="schedule.html" class="nav-item">
      <span class="nav-icon">🗓️</span> Schedule
    </a>
    <a href="tasks.html" class="nav-item">
      <span class="nav-icon">✅</span> Tasks
    </a>
    <a href="tickets.html" class="nav-item">
      <span class="nav-icon">🎫</span> Tickets
    </a>

    <div class="sidebar-bottom">
      <div class="user-info">
        Signed in as <span id="usernameDisplay"></span>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </div>
  </div>

  <!-- ── MAIN CONTENT ─────────────────────────────── -->
  <div class="main-content">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h1>Inventory</h1>
        <p>Track your stock levels and product catalog</p>
      </div>
      <button id="addProductBtn" class="add-btn">+ Add Product</button>
    </div>

    <!-- SUMMARY BAR -->
    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-value" id="totalProducts">0</div>
        <div class="summary-label">Total Products</div>
      </div>
      <div class="summary-item">
        <div class="summary-value warning" id="lowStockCount">0</div>
        <div class="summary-label">Low Stock</div>
      </div>
      <div class="summary-item">
        <div class="summary-value danger" id="outOfStockCount">0</div>
        <div class="summary-label">Out of Stock</div>
      </div>
    </div>

    <!-- PRODUCT GRID -->
    <div id="productGrid">
      <div class="empty-state">No products yet — add your first product above</div>
    </div>
  </div>

  <!-- ── ADD PRODUCT MODAL ─────────────────────────── -->
  <div id="addProductModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>Add New Product</h2>
        <button id="closeProductModal" class="close-btn">✕</button>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="productName" placeholder="e.g. Coffee Beans" />
        </div>
        <div class="form-group">
          <label>SKU</label>
          <input type="text" id="productSku" placeholder="e.g. COF-001" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Starting Quantity</label>
          <input type="number" id="productQty" placeholder="0" min="0" />
        </div>
        <div class="form-group">
          <label>Unit</label>
          <input type="text" id="productUnit" placeholder="e.g. lbs, units, cases" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Low Stock Alert At</label>
          <input type="number" id="productAlert" placeholder="10" min="0" />
        </div>
        <div class="form-group">
          <label>Cost Price ($)</label>
          <input type="number" id="productCost" placeholder="0.00" step="0.01" min="0" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Sell Price ($)</label>
          <input type="number" id="productSell" placeholder="0.00" step="0.01" min="0" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="productDesc" placeholder="Optional description" />
        </div>
      </div>

      <div id="productModalError" class="modal-error" style="display:none;"></div>

      <div class="modal-footer">
        <button id="cancelProductBtn" class="cancel-btn">Cancel</button>
        <button id="saveProductBtn" class="save-btn">Save Product</button>
      </div>
    </div>
  </div>

  <!-- ── ADJUST STOCK MODAL ────────────────────────── -->
  <div id="adjustModal" class="modal-overlay" style="display:none;">
    <div class="modal" style="width:400px;">
      <div class="modal-header">
        <h2 id="adjustTitle">Adjust Stock</h2>
        <button id="closeAdjustModal" class="close-btn">✕</button>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label>Adjustment</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="adj-type-btn active" id="addStockBtn" onclick="setAdjustType('add')">+ Add Stock</button>
          <button class="adj-type-btn" id="removeStockBtn" onclick="setAdjustType('remove')">− Remove Stock</button>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label>Amount</label>
        <input type="number" id="adjustAmount" placeholder="0" min="1" />
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label>Reason</label>
        <input type="text" id="adjustReason" placeholder="e.g. Received shipment, Damaged goods" />
      </div>

      <div id="adjustError" class="modal-error" style="display:none;"></div>

      <div class="modal-footer">
        <button id="cancelAdjustBtn" class="cancel-btn">Cancel</button>
        <button id="saveAdjustBtn" class="save-btn">Save Adjustment</button>
      </div>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
