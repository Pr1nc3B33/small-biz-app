<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Small Biz App — Employee Login</title>
	<link rel="stylesheet" href="css/login.css" />
</head>
<body>
	<div class="login-box">
		<div class="logo">
			<h1>🏪 Small Biz App</h1>
			<p>Employee sign in</p>
		</div>

		<div class="error" id="errorMsg"></div>

		<div class="form-group">
			<label for="employeeEmail">Email</label>
			<input
				type="email"
				id="employeeEmail"
				placeholder="Enter your work email"
				autocomplete="email"
			/>
		</div>

		<div class="form-group">
			<label for="employeePassword">Password</label>
			<input
				type="password"
				id="employeePassword"
				placeholder="Enter your password"
				autocomplete="current-password"
			/>
		</div>

		<button id="employeeLoginBtn">Sign In</button>
	</div>

	<script src="js/employee-login.js"></script>
</body>
</html>
